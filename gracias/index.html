<style>
:root{
  --red:#CC1919;
  --black:#0A0A0A;
  --off:#F5F4F0;
  --white:#FFFFFF;
  --gray:#888888;
  --border:#E0DED8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--black);color:#fff;font-family:'Inter',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;line-height:1.6;
}
.wrap{max-width:460px;width:100%;text-align:center}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:34px}
.logo-box{
  width:44px;height:44px;background:var(--red);display:flex;align-items:center;
  justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;
  clip-path:polygon(0 0,85% 0,100% 15%,100% 100%,15% 100%,0 85%);
}
.logo-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#fff}
.check{
  width:74px;height:74px;border-radius:50%;background:var(--red);
  display:flex;align-items:center;justify-content:center;margin:0 auto 28px;
}
.check svg{width:36px;height:36px}
h1{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,8vw,42px);
  letter-spacing:1px;line-height:1.05;margin-bottom:16px;
}
h1 .red{color:var(--red)}
p.sub{color:#C9C9C9;font-size:16px;max-width:380px;margin:0 auto 34px}
.btn{
  display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;
  font-weight:700;font-size:14px;padding:14px 26px;border-radius:10px;
  text-decoration:none;margin-bottom:14px;
}
.back{
  display:block;color:#888;font-size:13px;text-decoration:none;margin-top:10px;
}
.back:hover{color:#fff}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <div class="logo-box">B</div>
    <span class="logo-name">BRAVO</span>
  </div>

  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>

  <h1>Recibimos<br><span class="red">tu solicitud.</span></h1>
  <p class="sub">Nuestro equipo te contactará para coordinar tu diagnóstico estratégico gratuito.</p>

  <a class="back" href="/bravolanding/">&larr; Volver al inicio</a>
</div>

</body>
